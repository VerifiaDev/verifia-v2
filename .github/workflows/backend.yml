# Offline backend checks on every push and pull request.
# No API keys, no network calls to Groq/Tavily: everything runs against fakes.
# Live checks (python backend_v2/check_all.py --url ...) stay manual, because they spend API credits.
name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend_v2/**"
      - "ai-engine/**"
      - "retrieval_demo_lite/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend_v2/**"
      - "ai-engine/**"
      - "retrieval_demo_lite/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12"]   # same as backend_v2/Dockerfile
    defaults:
      run:
        working-directory: backend_v2
    env:
      PYTHONUTF8: "1"
      # make sure no real key can leak in from anywhere: the tests must not need them
      GROQ_API_KEY: ""
      TAVILY_API_KEY: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend_v2/requirements.txt
            backend_v2/requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m compileall -q app tests check_all.py

      - name: pytest (contract, stream, partial results, errors, logging, pipeline, lite adapter)
        run: python -m pytest -q -p no:cacheprovider --junitxml=pytest-report.xml

      - name: check_all.py --skip-live
        run: python check_all.py --skip-live

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports-py${{ matrix.python }}
          path: |
            backend_v2/pytest-report.xml
            backend_v2/check_all_report.txt
          if-no-files-found: ignore
