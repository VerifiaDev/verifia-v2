# Frontend-backend entegrasyon testi: gerçek tarayıcı (Chromium) → yayın derlemesi frontend (next start)
# → gerçek backend uygulaması (backend_v2, sahte LLM ve sahte arama; anahtar yok, kota harcanmaz).
# Ayrıntı: e2e/playwright.config.mjs ve e2e/tests/integration.spec.mjs.
name: Entegrasyon

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: entegrasyon-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: frontend + backend (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      PYTHONUTF8: "1"
      PYTHON: python
      GROQ_API_KEY: ""
      TAVILY_API_KEY: ""
      # Frontend derlemesi bu adresi CSP'ye ve istemciye gömer; backend aynı portta açılır.
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8799
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend_v2/requirements.txt
            backend_v2/requirements-dev.txt

      - name: Backend bağımlılıkları
        run: python -m pip install -r backend_v2/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - name: Frontend bağımlılıkları ve yayın derlemesi
        run: |
          npm ci
          npm run build

      - name: Playwright ve Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Uçtan uca test (masaüstü ve telefon görünümü)
        working-directory: e2e
        run: npm test

      - name: Rapor
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
